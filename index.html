<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Aroua Memories Gallery</title>
  <script>
    // Applied immediately (before CSS/paint) so there's no flash of the wrong theme.
    (function () {
      var saved = localStorage.getItem('aroua-theme') || 'dark';
      document.documentElement.setAttribute('data-theme', saved);
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Cormorant+Garamond:ital,wght@1,500;1,600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #080d1a;
      --bg-glow-1: rgba(99, 102, 241, 0.15);
      --bg-glow-2: rgba(6, 182, 212, 0.12);
      --header-bg: rgba(8, 13, 26, 0.75);
      --glass-bg: rgba(255, 255, 255, 0.06);
      --glass-hover: rgba(255, 255, 255, 0.05);
      --sidebar-bg: rgba(10, 15, 30, 0.92);
      --backdrop-bg: rgba(3, 6, 14, 0.6);
      --card-glass: rgba(18, 26, 47, 0.65);
      --card-border: rgba(255, 255, 255, 0.08);
      --divider: rgba(255, 255, 255, 0.2);
      --primary: #6366f1;
      --accent: #06b6d4;
      --danger: #ef4444;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --title-grad-1: #ffffff;
      --title-grad-2: #a5f3fc;
      --modal-bg: rgba(5, 8, 18, 0.92);
      --shadow-1: rgba(0, 0, 0, 0.5);
      --shadow-2: rgba(0, 0, 0, 0.55);
      --active-grad-1: rgba(99, 102, 241, 0.25);
      --active-grad-2: rgba(6, 182, 212, 0.18);
      --active-border: rgba(99, 102, 241, 0.35);
    }

    :root[data-theme="light"] {
      --bg: #eaf3fb;
      --bg-glow-1: rgba(67, 139, 196, 0.20);
      --bg-glow-2: rgba(67, 139, 196, 0.12);
      --header-bg: rgba(255, 255, 255, 0.78);
      --glass-bg: rgba(67, 139, 196, 0.08);
      --glass-hover: rgba(67, 139, 196, 0.13);
      --sidebar-bg: rgba(255, 255, 255, 0.94);
      --backdrop-bg: rgba(15, 42, 61, 0.28);
      --card-glass: rgba(255, 255, 255, 0.72);
      --card-border: rgba(67, 139, 196, 0.25);
      --divider: rgba(16, 38, 58, 0.15);
      --primary: #438BC4;
      --accent: #6fb1dd;
      --danger: #ef4444;
      --text-main: #10263a;
      --text-muted: #4d7086;
      --title-grad-1: #164863;
      --title-grad-2: #438BC4;
      --modal-bg: rgba(224, 238, 248, 0.95);
      --shadow-1: rgba(67, 139, 196, 0.22);
      --shadow-2: rgba(67, 139, 196, 0.25);
      --active-grad-1: rgba(67, 139, 196, 0.22);
      --active-grad-2: rgba(111, 177, 221, 0.18);
      --active-border: rgba(67, 139, 196, 0.4);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--bg);
      background-image:
        radial-gradient(at 0% 0%, var(--bg-glow-1) 0px, transparent 50%),
        radial-gradient(at 100% 100%, var(--bg-glow-2) 0px, transparent 50%);
      background-attachment: fixed;
      color: var(--text-main);
      min-height: 100vh;
      padding-bottom: 4rem;
      overflow-x: hidden;
      transition: background-color 0.4s ease, color 0.4s ease;
    }

    /* ---------- Header ---------- */
    header {
      background: var(--header-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--card-border);
      position: sticky;
      top: 0;
      z-index: 100;
      padding: 1.1rem 1.25rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: background-color 0.4s ease, border-color 0.4s ease;
    }

    header h1 {
      font-size: 1.5rem;
      font-weight: 800;
      letter-spacing: -0.01em;
      background: linear-gradient(135deg, var(--title-grad-1) 0%, var(--title-grad-2) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .menu-btn, .theme-toggle-btn {
      background: var(--glass-bg);
      border: 1px solid var(--card-border);
      width: 44px;
      height: 44px;
      border-radius: 12px;
      cursor: pointer;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      transition: all 0.25s ease;
    }
    .menu-btn:hover, .theme-toggle-btn:hover { border-color: var(--active-border); background: var(--glass-hover); }
    .menu-btn span { display: block; width: 18px; height: 2px; background: var(--text-main); border-radius: 2px; }
    .theme-toggle-btn { font-size: 1.2rem; }

    /* ---------- Sidebar ---------- */
    .sidebar-backdrop {
      position: fixed;
      inset: 0;
      background: var(--backdrop-bg);
      backdrop-filter: blur(2px);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
      z-index: 150;
    }
    .sidebar-backdrop.show { opacity: 1; pointer-events: auto; }

    .sidebar {
      position: fixed;
      top: 0;
      left: 0;
      height: 100%;
      width: 280px;
      max-width: 82vw;
      background: var(--sidebar-bg);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border-right: 1px solid var(--card-border);
      transform: translateX(-100%);
      transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), background-color 0.4s ease;
      z-index: 200;
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
    }
    .sidebar.open { transform: translateX(0); }

    .sidebar-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1.5rem;
      padding: 0 0.25rem;
    }
    .sidebar-title { font-size: 1.05rem; font-weight: 700; color: var(--text-main); }
    .close-sidebar-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 1.6rem;
      line-height: 1;
      cursor: pointer;
    }
    .close-sidebar-btn:hover { color: var(--text-main); }

    .sidebar-nav { display: flex; flex-direction: column; gap: 0.4rem; overflow-y: auto; }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 0.85rem;
      padding: 0.85rem 0.9rem;
      border-radius: 14px;
      cursor: pointer;
      color: var(--text-muted);
      font-weight: 600;
      font-size: 0.95rem;
      border: 1px solid transparent;
      transition: all 0.25s ease;
    }
    .nav-item:hover { background: var(--glass-hover); color: var(--text-main); }
    .nav-item.active {
      background: linear-gradient(135deg, var(--active-grad-1), var(--active-grad-2));
      color: var(--text-main);
      border-color: var(--active-border);
    }
    .nav-icon { width: 22px; text-align: center; font-size: 1.15rem; flex-shrink: 0; }

    /* ---------- Content ---------- */
    .container { max-width: 720px; margin: 1.75rem auto 0; padding: 0 1.25rem; }

    .category-view { display: none; }
    .category-view.active { display: block; animation: fadeIn 0.35s ease; }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ---------- Hero banner ---------- */
    .category-hero {
      position: relative;
      border-radius: 24px;
      overflow: hidden;
      min-height: 168px;
      border: 1px solid var(--card-border);
      margin-bottom: 1.5rem;
      display: flex;
      align-items: flex-end;
    }
    .hero-icon {
      position: absolute;
      font-size: 6rem;
      line-height: 1;
      top: 50%;
      right: 0.75rem;
      transform: translateY(-50%);
      opacity: 0.25;
      pointer-events: none;
      user-select: none;
    }
    .hero-shade {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(0, 0, 0, 0) 30%, rgba(0, 0, 0, 0.6) 100%);
    }
    .hero-text { position: relative; z-index: 2; padding: 1.4rem 1.5rem; }
    .hero-text h2 { font-size: 1.4rem; font-weight: 800; color: #fff; letter-spacing: -0.01em; }
    .hero-text p { font-size: 0.85rem; color: rgba(255, 255, 255, 0.85); margin-top: 0.2rem; font-weight: 500; }

    /* ---------- Album card ---------- */
    .album-card {
      background: var(--card-glass);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      padding: 1.5rem;
      box-shadow: 0 20px 40px -15px var(--shadow-1);
      position: relative;
      overflow: hidden;
      transition: background-color 0.4s ease, border-color 0.4s ease;
    }
    .album-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--divider), transparent);
    }

    .album-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.2rem; }
    .album-title { font-size: 1.1rem; font-weight: 700; color: var(--text-main); letter-spacing: -0.01em; }

    .add-photo-btn {
      background: linear-gradient(135deg, var(--primary), var(--accent));
      color: #fff;
      border: none;
      width: 40px;
      height: 40px;
      border-radius: 12px;
      font-size: 1.4rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 16px -4px var(--shadow-1);
      transition: all 0.3s ease;
    }
    .add-photo-btn:hover { transform: scale(1.08) rotate(90deg); box-shadow: 0 12px 20px -4px var(--shadow-2); }

    /* ---------- Vertical photo list ---------- */
    .photo-list { display: flex; flex-direction: column; gap: 1rem; }

    .photo-frame {
      position: relative;
      border-radius: 20px;
      overflow: hidden;
      border: 1px solid var(--card-border);
      background: var(--card-glass);
      box-shadow: 0 10px 22px -10px var(--shadow-2);
      animation: fadeIn 0.3s ease;
      transition: background-color 0.4s ease, border-color 0.4s ease;
    }
    .photo-frame img {
      display: block;
      width: 100%;
      max-height: 380px;
      object-fit: cover;
      cursor: pointer;
      transition: transform 0.35s ease;
    }
    .photo-frame:hover img { transform: scale(1.02); }

    .empty-msg { display: block; text-align: center; color: var(--text-muted); font-size: 0.9rem; font-weight: 500; padding: 2.75rem 0; }

    /* ---------- Load more / pagination ---------- */
    .load-more-wrap { display: flex; flex-direction: column; align-items: center; gap: 0.4rem; margin-top: 1.2rem; }
    .load-more-btn {
      background: var(--glass-bg);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      font-family: inherit;
      font-weight: 700;
      font-size: 0.9rem;
      padding: 0.7rem 1.6rem;
      border-radius: 14px;
      cursor: pointer;
      transition: all 0.25s ease;
    }
    .load-more-btn:hover { background: linear-gradient(135deg, var(--active-grad-1), var(--active-grad-2)); border-color: var(--active-border); }
    .page-indicator { font-size: 0.78rem; color: var(--text-muted); font-weight: 600; }

    .album-footer { margin-top: 1.2rem; font-size: 0.85rem; color: var(--text-muted); font-weight: 500; display: flex; justify-content: space-between; align-items: center; }
    .status-loader { font-size: 0.8rem; color: var(--accent); font-weight: 700; display: none; }

    /* ---------- Modal / cinematic lightbox ---------- */
    .modal {
      display: none;
      position: fixed;
      z-index: 1000;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: var(--modal-bg);
      backdrop-filter: blur(18px);
      justify-content: center;
      align-items: center;
      padding: 1.5rem;
      transition: background-color 0.4s ease;
    }

    .modal-frame {
      position: relative;
      width: 100%;
      max-width: 460px;
      max-height: 88vh;
      background: var(--card-glass);
      backdrop-filter: blur(24px);
      border: 1px solid var(--card-border);
      border-radius: 28px;
      padding: 14px 14px 20px;
      box-shadow: 0 30px 60px -15px var(--shadow-1);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      animation: modalPop 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    }
    @keyframes modalPop {
      from { opacity: 0; transform: scale(0.94) translateY(10px); }
      to   { opacity: 1; transform: scale(1) translateY(0); }
    }

    .modal-frame img {
      width: 100%;
      max-height: 62vh;
      object-fit: contain;
      border-radius: 18px;
      display: block;
      background: rgba(0, 0, 0, 0.15);
    }

    .modal-caption {
      display: none;
      margin-top: 1rem;
      padding: 0 0.35rem;
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-size: 1.15rem;
      line-height: 1.55;
      text-align: center;
      color: var(--text-main);
      animation: captionRise 0.5s ease 0.1s both;
    }
    @keyframes captionRise {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .modal-close, .modal-delete {
      position: absolute;
      top: 24px;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: none;
      background: rgba(0, 0, 0, 0.5);
      color: #fff;
      font-size: 1.1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(6px);
      transition: all 0.2s ease;
      z-index: 3;
    }
    .modal-close { right: 24px; font-size: 1.4rem; }
    .modal-delete { left: 24px; background: rgba(239, 68, 68, 0.75); }
    .modal-close:hover { background: rgba(0, 0, 0, 0.7); transform: scale(1.08); }
    .modal-delete:hover { background: var(--danger); transform: scale(1.08); }

    input[type="file"] { display: none; }
  </style>
</head>
<body>

  <header>
    <button class="menu-btn" onclick="toggleSidebar()" aria-label="Open menu">
      <span></span><span></span><span></span>
    </button>
    <h1>Aroua Memories</h1>
    <button class="theme-toggle-btn" id="themeToggleBtn" onclick="toggleTheme()" aria-label="Toggle light/dark mode">☀️</button>

  <div class="sidebar-backdrop" id="sidebarBackdrop" onclick="toggleSidebar(false)"></div>
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <span class="sidebar-title">Albums</span>
      <button class="close-sidebar-btn" onclick="toggleSidebar(false)" aria-label="Close menu">&times;</button>
    </div>
    <nav class="sidebar-nav" id="sidebarNav"></nav>

  <div class="container" id="categoriesContainer"></div>

  <div class="modal" id="imageModal" onclick="closeModal()">

  </div>

  <!-- Firebase JS SDK (Module Version) -->

    // --------------------------------------------------------------

    const CHAT_ID = '-1004444889021';

    // --------------------------------------------------------------

      apiKey: "AIzaSyAjVC8r3IZdRwzH9PNVtw6Qk2m5YWHSaEk",

    // Initialize Firebase
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // ---------- Category definitions ----------
    const CATEGORIES = [
      { id: 'aesthetic',     label: 'Aesthetic',           subtitle: 'Soft tones and beautiful details',        icon: '✨', c1: '#a78bfa', c2: '#f472b6' },
      { id: 'summer',        label: 'Summer',              subtitle: 'Sun, sand, and unforgettable days',       icon: '☀️', c1: '#f59e0b', c2: '#db2777' },
      { id: 'autumn',        label: 'Autumn',              subtitle: 'Golden leaves and cozy afternoons',       icon: '🍂', c1: '#ea580c', c2: '#92400e' },

    const PAGE_SIZE = 5;
    const state = {};
    CATEGORIES.forEach(c => { state[c.id] = { photos: [], page: 0 }; });

    // currently open photo in the lightbox, so the delete button knows what to remove
    let currentModalPhoto = null;

    // ---------- Build UI ----------
    function buildLayout() {
      const nav = document.getElementById('sidebarNav');
      const container = document.getElementById('categoriesContainer');

      CATEGORIES.forEach((cat, idx) => {
        const navItem = document.createElement('div');
        navItem.className = 'nav-item' + (idx === 0 ? ' active' : '');
        navItem.id = `nav-${cat.id}`;
        navItem.onclick = () => window.showCategory(cat.id);
        navItem.innerHTML = `<span class="nav-icon">${cat.icon}</span><span>${cat.label}</span>`;
        nav.appendChild(navItem);

        const section = document.createElement('section');
        section.className = 'category-view' + (idx === 0 ? ' active' : '');
        section.id = `view-${cat.id}`;
        section.innerHTML = `
          <div class="category-hero" style="background: linear-gradient(135deg, ${cat.c1}, ${cat.c2});">
            <span class="hero-icon">${cat.icon}</span>
            <div class="hero-shade"></div>
            <div class="hero-text">
              <h2>${cat.label}</h2>
              <p>${cat.subtitle}</p>
            </div>
          </div>
          <div class="album-card">
            <div class="album-header">
              <h2 class="album-title">Photos</h2>
              <button class="add-photo-btn" onclick="document.getElementById('file-${cat.id}').click()">+</button>
              <input type="file" id="file-${cat.id}" accept="image/*" multiple>
            </div>
            <div class="photo-list" id="list-${cat.id}">
              <span class="empty-msg">Loading...</span>
            </div>
            <div class="load-more-wrap" id="loadmore-wrap-${cat.id}" style="display:none;">
              <button class="load-more-btn" onclick="window.loadMore('${cat.id}')">Show more ⌄</button>
              <span class="page-indicator" id="pageinfo-${cat.id}"></span>
            </div>
            <div class="album-footer">
              <span>Total: <span id="count-${cat.id}">0</span> photos</span>
              <span class="status-loader" id="loader-${cat.id}">Uploading...</span>
            </div>
          </div>
        `;
        container.appendChild(section);

        document.getElementById(`file-${cat.id}`).addEventListener('change', (e) => uploadPhotosToTelegram(e, cat.id));
      });
    }

    // ---------- Global UI Functions ----------
    window.toggleSidebar = function (force) {
      const sidebar = document.getElementById('sidebar');
      const backdrop = document.getElementById('sidebarBackdrop');
      const open = force !== undefined ? force : !sidebar.classList.contains('open');
      sidebar.classList.toggle('open', open);
      backdrop.classList.toggle('show', open);
    };

    window.showCategory = function (id) {
      CATEGORIES.forEach(c => {
        document.getElementById(`view-${c.id}`).classList.toggle('active', c.id === id);
        document.getElementById(`nav-${c.id}`).classList.toggle('active', c.id === id);
      });
      window.toggleSidebar(false);
    };

    // ---------- Theme (light / dark) ----------
    function applyThemeIcon() {
      const theme = document.documentElement.getAttribute('data-theme') || 'dark';
      const btn = document.getElementById('themeToggleBtn');
      if (btn) btn.textContent = theme === 'light' ? '🌙' : '☀️';
    }
    window.toggleTheme = function () {
      const current = document.documentElement.getAttribute('data-theme') || 'dark';
      const next = current === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      localStorage.setItem('aroua-theme', next);
      applyThemeIcon();
    };

    // ---------- Lightbox ----------
    window.openModal = function (photo, albumId) {
      currentModalPhoto = { albumId, ts: photo.ts };
      document.getElementById('modalImg').src = photo.url;
      const captionEl = document.getElementById('modalCaption');
      if (photo.caption && photo.caption.trim()) {
        captionEl.textContent = photo.caption;
        captionEl.style.display = 'block';
      } else {
        captionEl.textContent = '';
        captionEl.style.display = 'none';
      }
      document.getElementById('imageModal').style.display = 'flex';
    };

    window.closeModal = function () {
      document.getElementById('imageModal').style.display = 'none';
      currentModalPhoto = null;
    };

    window.deleteCurrentModalPhoto = async function () {
      if (!currentModalPhoto) return;
      if (!confirm('Delete this photo?')) return;
      const { albumId, ts } = currentModalPhoto;
      await deletePhoto(albumId, ts);
      window.closeModal();
    };

    // ---------- Firebase Storage Logic ----------
    async function persistAlbum(albumId) {
      try {
        await set(ref(db, `photos/${albumId}`), state[albumId].photos);
      } catch (err) {
        console.error('Firebase save error:', err);
      }
    }

    async function loadCategoryFromStorage(albumId) {
      try {
        const dbRef = ref(db);
        const snapshot = await get(child(dbRef, `photos/${albumId}`));
        if (snapshot.exists()) {
          let list = snapshot.val() || [];
          list.sort((a, b) => (b.ts || 0) - (a.ts || 0));
          state[albumId].photos = list;
        } else {
          state[albumId].photos = [];
        }
      } catch (err) {
        console.error('Firebase read error:', err);
        state[albumId].photos = [];
      }
      state[albumId].page = 0;
      renderPhotoList(albumId);
    }

    // ---------- Upload Flow ----------
    async function uploadPhotosToTelegram(event, albumId) {
      const files = event.target.files;
      if (!files || files.length === 0) return;

      const loader = document.getElementById(`loader-${albumId}`);
      loader.style.display = 'inline';

      let idx = 0;
      for (const file of files) {
        try {
          // Ask once per photo whether to attach a caption/description.
          const caption = (prompt('Add a description for this photo? (leave empty to skip)') || '').trim();

          const formData = new FormData();
          formData.append('chat_id', CHAT_ID);
          formData.append('photo', file);
          formData.append('caption', `#${albumId}`);

          const res = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, {
            method: 'POST',
            body: formData
          });
          const data = await res.json();

          if (data.ok) {
            const sizes = data.result.photo;
            const fileId = sizes[sizes.length - 1].file_id;
            const url = await getTelegramFileUrl(fileId);
            if (url) {
              const photo = { url, fileId, ts: Date.now() + idx, caption };
              state[albumId].photos.unshift(photo);
              state[albumId].page = 0;
              await persistAlbum(albumId);
              renderPhotoList(albumId);
            }
          }
        } catch (error) {
          console.error('Error uploading photo:', error);
        }
        idx++;
      }

      loader.style.display = 'none';
      event.target.value = '';
    }

    async function getTelegramFileUrl(fileId) {
      try {
        const res = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/getFile?file_id=${fileId}`);
        const data = await res.json();
        if (data.ok) {
          return `https://api.telegram.org/file/bot${BOT_TOKEN}/${data.result.file_path}`;
        }
      } catch (err) {
        console.error('Error getting file URL:', err);
      }
      return null;
    }

    // ---------- Rendering ----------
    function renderPhotoList(albumId) {
      const listEl = document.getElementById(`list-${albumId}`);
      const photos = state[albumId].photos;
      listEl.innerHTML = '';

      if (!photos.length) {
        listEl.innerHTML = '<span class="empty-msg">No photos added yet</span>';
      } else {
        const start = state[albumId].page * PAGE_SIZE;
        const pageItems = photos.slice(start, start + PAGE_SIZE);
        pageItems.forEach(photo => {
          const frame = document.createElement('div');
          frame.className = 'photo-frame';

          const img = document.createElement('img');
          img.src = photo.url;
          img.loading = 'lazy';
          img.onclick = () => window.openModal(photo, albumId);

          frame.appendChild(img);
          listEl.appendChild(frame);
        });
      }

      updateAlbumFooter(albumId);
    }

    function updateAlbumFooter(albumId) {
      const photos = state[albumId].photos;
      document.getElementById(`count-${albumId}`).textContent = photos.length;

      const wrap = document.getElementById(`loadmore-wrap-${albumId}`);
      const pageInfo = document.getElementById(`pageinfo-${albumId}`);

      if (photos.length <= PAGE_SIZE) {
        wrap.style.display = 'none';
      } else {
        const totalPages = Math.ceil(photos.length / PAGE_SIZE);
        wrap.style.display = 'flex';
        pageInfo.textContent = `Page ${state[albumId].page + 1} of ${totalPages}`;
      }
    }

    window.loadMore = function (albumId) {
      const totalPages = Math.ceil(state[albumId].photos.length / PAGE_SIZE) || 1;
      state[albumId].page = (state[albumId].page + 1) % totalPages;
      renderPhotoList(albumId);
      document.getElementById(`view-${albumId}`).scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    };

    async function deletePhoto(albumId, ts) {
      state[albumId].photos = state[albumId].photos.filter(p => p.ts !== ts);
      await persistAlbum(albumId);

      const totalPages = Math.ceil(state[albumId].photos.length / PAGE_SIZE) || 1;
      if (state[albumId].page >= totalPages) state[albumId].page = Math.max(0, totalPages - 1);

      renderPhotoList(albumId);
    }

    // ---------- Initialization ----------
    window.addEventListener('DOMContentLoaded', () => {
      buildLayout();
      applyThemeIcon();
      CATEGORIES.forEach(c => loadCategoryFromStorage(c.id));
    });
  </script>

</body>
</html>
